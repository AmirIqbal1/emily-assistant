name: emily

services:
  emily-core:
    build:
      context: ./services/emily-core
    environment:
      TZ: ${TZ:-Europe/London}
      EMILY_NAME: ${EMILY_NAME:-Emily}
      EMILY_LOG_LEVEL: ${EMILY_LOG_LEVEL:-INFO}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://host.docker.internal:8123}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      ENTITY_CACHE_SECONDS: ${ENTITY_CACHE_SECONDS:-30}
      HOME_ASSISTANT_CONTROL_ENABLED: ${HOME_ASSISTANT_CONTROL_ENABLED:-true}
    ports:
      - "${EMILY_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime/emily:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  homeassistant:
    image: ${HOME_ASSISTANT_IMAGE:-ghcr.io/home-assistant/home-assistant:stable}
    # Host networking is required for reliable local device discovery (mDNS/SSDP)
    # and lets Home Assistant communicate directly with trusted LAN devices.
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./runtime/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

  music-assistant-server:
    image: ${MUSIC_ASSISTANT_IMAGE:-ghcr.io/music-assistant/server:latest}
    profiles:
      - music
    # Music Assistant also uses host networking for player discovery on the LAN.
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./runtime/music-assistant:/data
    restart: unless-stopped
