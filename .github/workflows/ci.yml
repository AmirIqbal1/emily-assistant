name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/emily-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/emily-core/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example --profile music config
      - name: Build Emily Core image
        run: docker build --tag emily-core:ci services/emily-core
