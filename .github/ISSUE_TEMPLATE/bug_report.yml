name: Bug report
description: Report a reproducible problem in Emily
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove tokens, personal data, and private network details from logs.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start…\n2. Open…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Emily version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized diagnostics
      description: Include OS, architecture, Docker versions, and relevant logs. Never include `.env`.

