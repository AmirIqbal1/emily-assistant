<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Emily Core local assistant interface">
    <title>Emily Core</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">Core v0.3</div>
          <h1>Emily</h1>
        </div>
        <button id="refresh-status" class="status-button" type="button" aria-label="Refresh system status">
          <span id="status-dot" class="status-dot pending" aria-hidden="true"></span>
          <span id="status-text">Checking status</span>
        </button>
      </header>

      <section id="messages" class="messages" aria-live="polite" aria-label="Conversation">
        <article class="message assistant">
          <span class="message-label">Emily</span>
          <p>Hello. I’m Emily. Emily Core is ready.</p>
        </article>
      </section>

      <section class="devices" aria-labelledby="music-heading">
        <div class="devices-heading">
          <div>
            <div class="eyebrow">Music Assistant</div>
            <h2 id="music-heading">Music <span id="music-count">—</span></h2>
          </div>
          <button id="refresh-music" class="secondary-button" type="button">Refresh</button>
        </div>
        <p id="music-status" class="devices-status">Loading Music Assistant status…</p>
        <p id="music-mode" class="devices-status"></p>
        <ul id="music-list" class="device-list" aria-live="polite"></ul>
      </section>

      <section class="devices" aria-labelledby="devices-heading">
        <div class="devices-heading">
          <div>
            <div class="eyebrow">Home Assistant</div>
            <h2 id="devices-heading">Devices <span id="entity-count">—</span></h2>
          </div>
          <button id="refresh-devices" class="secondary-button" type="button">Refresh</button>
        </div>
        <p id="devices-status" class="devices-status">Loading device list…</p>
        <p id="devices-mode" class="devices-status"></p>
        <input id="device-search" type="search" maxlength="100" placeholder="Search devices" aria-label="Search devices">
        <div id="domain-counts" class="domain-counts" aria-label="Supported device counts"></div>
        <ul id="device-list" class="device-list" aria-live="polite"></ul>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
      <div id="loading" class="loading" hidden>Emily is thinking…</div>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Message Emily</label>
        <input
          id="message-input"
          name="message"
          type="text"
          maxlength="1000"
          autocomplete="off"
          placeholder="Message Emily…"
          required
        >
        <button id="send-button" type="submit">Send</button>
      </form>

      <footer>
        <button id="clear-button" class="text-button" type="button">Clear conversation</button>
        <span>Private, local, open source.</span>
      </footer>
    </main>
  </body>
</html>
